spring.application.name=workaudit
server.port=8082


spring.datasource.url=jdbc:postgresql://localhost:5432/workaudit
spring.datasource.username=postgres
spring.datasource.password=admin123


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
workaudit.storage.path=./uploads
workaudit.validation.late-cutoff=10:00
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# Where uploaded PDF reports are saved
workaudit.storage.pdf-root=./pdf-storage



jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.springframework.security=DEBUG
